name: Deploy OC Dev to VPS

on:
  push:
    branches: [main]
    paths:
      - "oc/**"
      - ".github/workflows/deploy-oc.yml"

jobs:
  deploy:
    name: Deploy dev.organicconcepts.de
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /root/organicconcepts-dev
            git pull origin main
            echo "OC deploy complete!"
