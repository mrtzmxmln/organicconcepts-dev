name: Deploy OC Dev to VPS

on:
  push:
    branches: [main]
    paths:
      - "oc/**"
      - ".github/workflows/deploy-oc.yml"

jobs:
  deploy:
    name: Deploy dev.organicconcepts.de
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /root/organicconcepts-dev
            git pull origin main

            docker exec -w /app oc_dev_app composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            docker exec -w /app oc_dev_app php artisan migrate --force
            docker exec -w /app oc_dev_app php artisan config:cache
            docker exec -w /app oc_dev_app php artisan route:cache
            docker exec -w /app oc_dev_app php artisan view:cache
            echo "OC deploy complete!"
