services:
  # Der Webserver & PHP-Dienst für Laravel
  app:
    image: webdevops/php-nginx:8.3-alpine
    container_name: bc_laravel_app
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - PHP_DATE_TIMEZONE=Europe/Berlin
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.bc-dev.rule=Host(`bc.dev.organicconcepts.de`)"
      - "traefik.http.routers.bc-dev.entrypoints=https"
      - "traefik.http.routers.bc-dev.tls=true"
      - "traefik.http.services.bc-dev.loadbalancer.server.port=80"
      - "traefik.http.routers.bc-dev-http.rule=Host(`bc.dev.organicconcepts.de`)"
      - "traefik.http.routers.bc-dev-http.entrypoints=http"
      - "traefik.http.routers.bc-dev-http.middlewares=https-redirect@docker"

networks:
  traefik-proxy:
    external: true
