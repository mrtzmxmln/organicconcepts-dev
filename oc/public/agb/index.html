<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Concepts — AGB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system.css">
<style>
  .nav { position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: var(--sp-2) var(--gutter); background: var(--bg); border-bottom: var(--border); }
  .nav__brand { font-family: var(--font-mono); font-weight: 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .nav__brand b { color: var(--c-black); background: var(--accent); padding: 0 0.3em; }
  .nav__back { font-family: var(--font-mono); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: var(--tracking-mono); }
  .nav__back:hover { color: var(--c-grey-500); }

  .page-header { padding: var(--sp-8) var(--gutter) var(--sp-6); border-bottom: var(--border-thick); }
  .page-header .eyebrow { margin-bottom: var(--sp-3); display: block; }
  .page-header h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: var(--fs-xl); line-height: 0.9; }

  .content { padding: var(--sp-8) var(--gutter) var(--sp-12); max-width: 72ch; }
  .content .agb-link { display: block; border: var(--border); padding: var(--sp-4) var(--sp-6); margin-bottom: var(--sp-3); font-family: var(--font-mono); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: var(--tracking-mono); transition: background var(--speed) var(--ease); }
  .content .agb-link:hover { background: var(--accent); color: var(--c-black); }
  .content .agb-link::after { content: ' →'; color: var(--accent); }
  .content .agb-link:hover::after { color: var(--c-black); }

  footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-3) var(--gutter); border-top: var(--border-hair); font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--tracking-mono); }
  footer a { opacity: 0.55; }
  footer a:hover { opacity: 1; }
  .footer__legal { display: flex; gap: var(--sp-4); }
</style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav__brand">ORGANIC<b>CONCEPTS</b></a>
    <a href="/" class="nav__back">← Zurück</a>
  </nav>

  <header class="page-header">
    <span class="eyebrow">[ LEGAL ]</span>
    <h1>Allgemeine Geschäfts&shy;bedingungen</h1>
  </header>

  <div class="content">
    <a href="/agb/partner-plans/" class="agb-link">AGB Partner Plans</a>
  </div>

  <footer>
    <span>© 2026 ORGANIC CONCEPTS</span>
    <nav class="footer__legal">
      <a href="/impressum/">Impressum</a>
      <a href="/datenschutz/">Datenschutz</a>
      <a href="/agb/">AGB</a>
    </nav>
    <span>STRATEGISCH DENKEN, DIGITAL HANDELN.</span>
  </footer>

</body>
</html>
